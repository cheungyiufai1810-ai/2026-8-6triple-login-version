function showToast(msg) { const t=document.getElementById('toast'); if(!t){alert(msg);return;} t.textContent=msg; t.classList.add('show'); clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),3000); }
function speakCantonese(text) {
  if(!voiceEnabled || !window.speechSynthesis) return Promise.resolve();
  window.speechSynthesis.cancel();
  return new Promise(resolve => {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang='zh-HK'; utter.volume=1; utter.rate=0.9;
    const setVoice = () => {
      const voices = window.speechSynthesis.getVoices();
      const voice = voices.find(v=>v.lang==='zh-HK') || voices.find(v=>v.lang.startsWith('zh')) || null;
      if(voice) utter.voice = voice;
      let resolved=false; const done=()=>{if(!resolved){resolved=true;resolve();}};
      utter.onend=done; utter.onerror=done;
      const timer=setTimeout(()=>{if(!resolved){resolved=true;resolve();}},5000);
      utter.onend=()=>{clearTimeout(timer);done();};
      utter.onerror=()=>{clearTimeout(timer);done();};
      window.speechSynthesis.speak(utter);
    };
    if(window.speechSynthesis.getVoices().length>0) setVoice();
    else window.speechSynthesis.addEventListener('voiceschanged', setVoice, {once:true});
  });
}
async function speakWithDelay(p1,p2) { voiceLock=true; try{ await speakCantonese(p1); await new Promise(r=>setTimeout(r,2000)); if(p2) await speakCantonese(p2); } catch(e){} finally{ voiceLock=false; } }
function calcDistance(lat1,lon1,lat2,lon2) { const R=6371000; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }

function playBoostedAudio(b64,boost) {
  if(!b64) return;
  try {
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const bin=atob(b64); const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    ctx.decodeAudioData(bytes.buffer, buf=>{
      const src=ctx.createBufferSource(); src.buffer=buf;
      const gain=ctx.createGain(); gain.gain.value=boost||10;
      src.connect(gain); gain.connect(ctx.destination); src.start(0);
    }, ()=>{
      const a=new Audio('data:audio/webm;base64,'+b64); a.volume=1; a.play().catch(()=>{});
    });
  } catch(e) { const a=new Audio('data:audio/webm;base64,'+b64); a.volume=1; a.play().catch(()=>{}); }
}
window.playBoostedAudio = playBoostedAudio;

function setupRecordButton(btnId,timerId,cb) {
  const btn=document.getElementById(btnId); if(!btn) return;
  const timer=document.getElementById(timerId);
  let isRec=false, mr=null, ms=null, chunks=[], recTimer=null, sec=0;
  const start = (e) => {
    e.preventDefault(); if(isRec) return; isRec=true;
    setTimeout(()=>{
      if(!navigator.mediaDevices?.getUserMedia){ showToast('不支援錄音'); isRec=false; return; }
      navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
        ms=stream; mr=new MediaRecorder(stream,{audioBitsPerSecond:128000}); chunks=[];
        mr.ondataavailable=e=>chunks.push(e.data);
        mr.onstop=()=>{
          const blob=new Blob(chunks,{type:'audio/webm'}); const r=new FileReader();
          r.onload=()=>{ cb(r.result.split(',')[1]); showToast('錄音完成'); };
          r.readAsDataURL(blob); btn.classList.remove('recording');
          if(timer){timer.style.display='none';timer.textContent='0s';}
          clearInterval(recTimer); recTimer=null;
        };
        mr.start(); btn.classList.add('recording'); sec=0;
        if(timer){timer.style.display='block';timer.textContent='0s';}
        recTimer=setInterval(()=>{sec++;if(timer)timer.textContent=sec+'s';},1000);
      }).catch(()=>{ showToast('無法開啟咪高峰'); isRec=false; btn.classList.remove('recording'); });
    },500);
  };
  const stop = (e) => { e.preventDefault(); if(mr&&mr.state==='recording'){ mr.stop(); if(ms){ms.getTracks().forEach(t=>t.stop());ms=null;} } isRec=false; };
  btn.addEventListener('pointerdown', start); btn.addEventListener('pointerup', stop); btn.addEventListener('pointerleave', stop); btn.addEventListener('pointercancel', stop);
}

function updateDriverUI() {
  const route=getRoute(), idx=driverData.stationIndex||0, station=route[idx]||'未知';
  const nextIdx=idx+1<route.length?idx+1:0, nextStation=route[nextIdx]||'終點';

  document.getElementById('d-station').textContent = station;
  document.getElementById('d-target').textContent = '下一站：'+nextStation;
  document.getElementById('d-pass-count').textContent = driverData.passengerCount;
  document.getElementById('d-mode-badge').textContent = driverData.mode==='busy'?'西鐵快線':'市中心循環線';
  document.getElementById('d-dir-badge').textContent = driverData.direction===0?'往元朗':'往大棠';
  const fb=document.getElementById('d-full-btn'); if(fb){ fb.style.background=driverData.isFull?'var(--red)':'var(--green)'; fb.textContent=driverData.isFull?'✅ 滿座':'🚫 滿座'; }
  document.getElementById('d-car-btn').textContent = driverData.carSeats+'座';
  renderDriverRouteStrip();
  const mb=document.getElementById('btn-mode-toggle'); if(mb) mb.textContent = driverData.mode==='busy'?'🔄 切換至市中心循環線':'🔄 切換至西鐵快線';
}
function renderDriverRouteStrip() {
  const strip=document.getElementById('d-route-strip'); if(!strip) return;
  const route=getRoute(), idx=driverData.stationIndex||0;
  if(strip.children.length!==route.length) { strip.innerHTML=''; route.forEach((n,i)=>{ const d=document.createElement('div'); d.className='dot-node'; d.innerHTML=`<div class="dot"></div><span>${n}</span>`; strip.appendChild(d); }); }
  Array.from(strip.children).forEach((n,i)=>{ n.className='dot-node'; if(i<idx)n.classList.add('passed'); else if(i===idx)n.classList.add('current'); else if(i===idx+1)n.classList.add('next'); const s=n.querySelector('span'); if(s&&s.textContent!==route[i]) s.textContent=route[i]; });
  if(idx!==lastDriverScrollIndex) { const c=strip.querySelector('.dot-node.current'); if(c){ const sr=strip.getBoundingClientRect(), cr=c.getBoundingClientRect(); strip.scrollLeft += cr.left-sr.left-(sr.width/2)+(cr.width/2); } lastDriverScrollIndex=idx; }
}
function updateDriverDB() {
  if(!driverData.plate) return;
  const route=getRoute(), idx=driverData.stationIndex||0;
  db.ref('van/active_buses/'+driverData.plate).update({
    plate:driverData.plate, mode:driverData.mode, direction:driverData.direction,
    stationIndex:idx, currentStation:route[idx]||'未知',
    nextStation:idx+1<route.length?route[idx+1]:'終點',
    passengerCount:driverData.passengerCount, isActive:driverData.isActive,
    carSeats:driverData.carSeats, isFull:driverData.isFull,
    lastUpdate:Date.now(), driverUid:currentUser.uid, driverIdentifier:currentUser.identifier
  }).catch(console.warn);
  updateDriverUI();
}
function resetDriverData(keepPlate) {
  driverData.stationIndex=0; driverData.passengerCount=0; driverData.isFull=false; driverData.isActive=false;
  if(!keepPlate) driverData.plate=null;
  lastReportedIndex=-1; lastDriverScrollIndex=-1;
  if(gpsWatchId){ navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId=null; }
  if(gpsRetryTimer){ clearTimeout(gpsRetryTimer); gpsRetryTimer=null; }
  releaseWakeLock(); updateDriverUI();
  if(driverData.plate) db.ref('van/active_buses/'+driverData.plate).remove().catch(()=>{});
  document.getElementById('d-gps-status').textContent='📍 GPS 已停止';
  document.getElementById('start-gps').style.display='block';
  document.getElementById('stop-gps').style.display='none';
  document.getElementById('gps-debug').style.display='none';

}
async function requestWakeLock() {
  try {
    if('wakeLock' in navigator) {
      if(wakeLock) try{ await wakeLock.release(); } catch(e){} wakeLock=null;
      wakeLock = await navigator.wakeLock.request('screen');
      document.getElementById('wake-lock-status').textContent='🔋 屏幕喚醒鎖: 已啟用 ✅';
      document.getElementById('wake-lock-status').classList.add('active');
      wakeLock.addEventListener('release',()=>{
        document.getElementById('wake-lock-status').textContent='🔋 屏幕喚醒鎖: 已釋放';
        document.getElementById('wake-lock-status').classList.remove('active');
        if(driverData.isActive&&!document.hidden) setTimeout(requestWakeLock,1000);
      });
      return true;
    } else { document.getElementById('wake-lock-status').textContent='🔋 屏幕喚醒鎖: 不支援'; return false; }
  } catch(e) { document.getElementById('wake-lock-status').textContent='🔋 屏幕喚醒鎖: 失敗'; return false; }
}
async function releaseWakeLock() { try{ if(wakeLock){ await wakeLock.release(); wakeLock=null; } } catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&driverData.isActive&&!wakeLock) requestWakeLock(); });

function startGpsWatch() {
  if(gpsStarting) return; gpsStarting=true;
  if(gpsWatchId){ navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId=null; }
  if(gpsRetryTimer){ clearTimeout(gpsRetryTimer); gpsRetryTimer=null; }
  document.getElementById('d-gps-status').textContent='📍 GPS 定位中⋯';
  document.getElementById('gps-debug').style.display='block'; document.getElementById('gps-debug').textContent='⏳ 等待衛星信號⋯';
  let firstFix=false; gpsFirstFix=false;
  gpsWatchId = navigator.geolocation.watchPosition(pos=>{
    gpsStarting=false;
    if(!firstFix){ firstFix=true; gpsFirstFix=true; showToast('GPS 已定位'); document.getElementById('d-gps-status').textContent='📍 GPS 已定位'; if(gpsRetryTimer){clearTimeout(gpsRetryTimer);gpsRetryTimer=null;} }
    if(!driverData.isActive||!driverData.plate||voiceLock) return;
    const coords=getCoords(), route=getRoute(); if(!coords?.length) return;
    let min=Infinity, near=0;
    for(let i=0;i<coords.length;i++){ const d=calcDistance(pos.coords.latitude,pos.coords.longitude,coords[i].lat,coords[i].lng); if(d<min){min=d;near=i;} }
    document.getElementById('gps-debug').textContent=`📍 ${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)} | 最近站: ${route[near]} (${Math.round(min)}m) | 當前索引: ${driverData.stationIndex} | 上報索引: ${lastReportedIndex}`;
    document.getElementById('d-gps-status').textContent=`📍 ${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)} · 最近站: ${route[near]} (${Math.round(min)}m)`;
    if(min<150&&near>lastReportedIndex) {
      lastReportedIndex=near; driverData.stationIndex=near; updateDriverDB(); renderDriverRouteStrip();
      const s=route[near]; const nxt=near+1<route.length?route[near+1]:null;
      if(voiceEnabled&&!voiceLock) { if(nxt) speakWithDelay('到達 '+s,'下一站 '+nxt); else speakCantonese('到達 '+s).then(()=>setTimeout(()=>speakCantonese('已到達總站'),2000)); }
      if(near===route.length-1&&driverData.isActive) {
        setTimeout(()=>{
          if(!driverData.isActive) return;
          driverData.direction=driverData.direction===0?1:0; driverData.stationIndex=0; driverData.passengerCount=0; driverData.isFull=false; lastReportedIndex=-1; lastDriverScrollIndex=-1;
          updateDriverDB(); renderDriverRouteStrip(); showToast('🔄 已到總站，自動掉頭，乘客清空');
          if(voiceEnabled){ const nr=getRoute(); if(nr.length>1) setTimeout(()=>speakCantonese('下一站 '+nr[1]),500); }
        },3000);
      }
    }
  }, err=>{
    gpsStarting=false;
    document.getElementById('d-gps-status').textContent='📍 GPS 定位失敗，請檢查權限';
    document.getElementById('gps-debug').textContent=`⚠️ 錯誤: ${err.message}`;
    if(err.code===3){ if(gpsWatchId){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;} setTimeout(()=>{if(driverData.isActive)startGpsWatch();},5000); }
  }, {enableHighAccuracy:true, timeout:15000, maximumAge:5000});
  gpsRetryTimer=setTimeout(()=>{ if(!gpsFirstFix&&driverData.isActive){ if(gpsWatchId){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;} startGpsWatch(); } },10000);
}

function startDuty() {
  if(!driverData.plate){ showToast('請先設定車牌'); return; }
  if(!navigator.geolocation){ showToast('瀏覽器不支援 GPS'); return; }
  gpsFirstFix=false; if(gpsRetryTimer){clearTimeout(gpsRetryTimer);gpsRetryTimer=null;} voiceLock=false;
  requestWakeLock(); driverData.isActive=true; driverData.stationIndex=0; driverData.direction=0; driverData.passengerCount=0; driverData.isFull=false; lastReportedIndex=-1; lastDriverScrollIndex=-1;
  updateDriverDB(); startGpsWatch();

  showToast('🟢 已開始當值，等待 GPS 定位⋯'); if(voiceEnabled) speakCantonese('開始當值');

function stopDuty() {

function loadAdminAnnounce() {
  db.ref('van/announcements').orderByChild('timestamp').limitToLast(20).on('value',snap=>{

    const lc=document.getElementById('announce-list-container'), tb=document.getElementById('announce-toggle-btn'); let all=[],exp=false;
    snap.forEach(c=>all.push({key:c.key,ann:c.val()})); all.sort((a,b)=>b.ann.timestamp-a.ann.timestamp);
    function render(expand){ lc.innerHTML=''; const dd=expand?all:all.slice(0,5); if(all.length===0) lc.innerHTML='<div style="color:#888;padding:8px;font-size:15px;">暫無公告</div>'; else dd.forEach(i=>{ const a=i.ann,isA=!!a.audio,isS=isAnnounceFromSuperAdmin(a); const d=document.createElement('div'); d.className='admin-item'; d.style.borderLeftColor='var(--gold)'; d.style.padding='8px 10px'; d.innerHTML=`<div class="info">${new Date(a.timestamp).toLocaleString('zh-HK')} ${isS?'⭐ 超級管理員':''}</div><div style="font-size:15px;">${isA?'🎤 [語音公告]':(a.text||'')}</div>`; if(isA){ const b=document.createElement('button'); b.className='play-audio'; b.textContent='▶ 播放'; b.addEventListener('click',()=>playBoostedAudio(a.audio,10)); d.appendChild(b); } const db=document.createElement('button'); db.className='btn btn-secondary'; db.style.cssText='width:auto;padding:4px 10px;font-size:13px;'; db.textContent='🗑️'; db.addEventListener('click',()=>{ if(!checkCanDeleteAnnounce(a))return; if(!confirm('確定刪除此公告？'))return; db.ref('van/announcements/'+i.key).remove().then(()=>showToast('已刪除')); }); d.appendChild(db); lc.appendChild(d); }); tb.textContent=expand?'📋 收起':`📋 顯示全部 (${all.length} 條)`; }

function initAdminWalkie() { if(!isAdmin)return; updateAdminWalkieTargets(); if(adminWalkieRef)adminWalkieRef.off(); adminWalkieRef=db.ref('van/walkie_talkie').orderByChild('timestamp').limitToLast(50); adminWalkieRef.on('value',snap=>{ const c=document.getElementById('admin-walkie-messages'); if(!c)return; c.innerHTML=''; snap.forEach(ch=>{ const m=ch.val(); if(m.hidden)return; const time=new Date(m.timestamp).toLocaleTimeString('zh-HK'), sender=m.senderPlate||'未知司機', target=m.target==='all'?'📢全部':m.target; const d=document.createElement('div'); d.style.cssText='padding:4px 0;border-bottom:1px solid #333;font-size:14px;'; const ts=document.createElement('span'); ts.style.color='#888'; ts.textContent=`[${time}] `; d.appendChild(ts); d.appendChild(document.createTextNode(sender+' → '+target+': ')); if(m.audio){ const b=document.createElement('button'); b.className='play-audio'; b.textContent='▶ 語音'; b.addEventListener('click',()=>playBoostedAudio(m.audio,10)); d.appendChild(b); } else d.appendChild(document.createTextNode(m.text||'')); const db=document.createElement('button'); db.className='btn btn-secondary'; db.style.cssText='width:auto;padding:4px 10px;font-size:13px;'; db.textContent='🗑️'; db.addEventListener('click',()=>{ if(confirm('管理員刪除此對講機訊息？')) db.ref('van/walkie_talkie/'+ch.key).remove().then(()=>showToast('已刪除')); }); d.appendChild(db); c.appendChild(d); }); if(c.children.length===0){ c.innerHTML='<div style="color:#888;font-size:14px;text-align:center;padding:12px;">暫無對講機訊息</div>'; } }); }

async function checkRole(identifier) {
  let role='passenger';
  const admSnap=await db.ref('admins').once('value'); admSnap.forEach(c=>{ const d=c.val(); if(d.identifier===identifier||d.email===identifier||d.phone===identifier||d.uid===identifier) role='admin'; });
  if(role==='passenger'){ const drvSnap=await db.ref('drivers').once('value'); drvSnap.forEach(c=>{ const d=c.val(); if(d.identifier===identifier||d.email===identifier||d.phone===identifier||d.uid===identifier) role='driver'; }); }
  return role;
}

// 轉數快複製
document.getElementById('fps-code').addEventListener('click',()=>{ const t='122891914'; if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>showToast('✅ 已複製：'+t)).catch(()=>{ const i=document.createElement('input'); i.value=t; document.body.appendChild(i); i.select(); document.execCommand('copy'); document.body.removeChild(i); showToast('✅ 已複製：'+t); }); else { const i=document.createElement('input'); i.value=t; document.body.appendChild(i); i.select(); document.execCommand('copy'); document.body.removeChild(i); showToast('✅ 已複製：'+t); } });
// 語音開關
document.getElementById('global-voice-btn').addEventListener('click',function(){ voiceEnabled=!voiceEnabled; this.textContent=voiceEnabled?'🔊':'🔇'; this.classList.toggle('muted'); showToast(voiceEnabled?'語音已開啟':'語音已關閉'); localStorage.setItem('globalVoice',voiceEnabled?'on':'off'); if(!voiceEnabled&&window.speechSynthesis)window.speechSynthesis.cancel(); });
if(localStorage.getItem('globalVoice')==='off'){ voiceEnabled=false; document.getElementById('global-voice-btn').textContent='🔇'; document.getElementById('global-voice-btn').classList.add('muted'); }

// 連線狀態
db.ref('.info/connected').on('value',snap=>{ const s=document.getElementById('connection-status'); if(!s)return; if(snap.val()){ s.textContent='🟢 已成功連線至伺服器'; s.className='connection-status online'; setTimeout(()=>s.style.display='none',2500); } else { s.textContent='🔴 網絡已中斷，嘗試重新連線中...'; s.className='connection-status offline'; s.style.display='block'; } });
// 自動清理舊訊息
setTimeout(()=>{ const week=Date.now()-7*24*60*60*1000; db.ref('van/messages').orderByChild('timestamp').endAt(week).once('value').then(s=>{ const u={}; s.forEach(c=>u[c.key]=null); if(Object.keys(u).length) db.ref('van/messages').update(u); }); db.ref('van/walkie_talkie').orderByChild('timestamp').endAt(week).once('value').then(s=>{ const u={}; s.forEach(c=>u[c.key]=null); if(Object.keys(u).length) db.ref('van/walkie_talkie').update(u); }); },3000);
// 清理舊登入記錄
setTimeout(()=>{ const month=Date.now()-30*24*60*60*1000; db.ref('login_logs').orderByChild('loginTime').endAt(month).once('value').then(s=>{ const u={}; s.forEach(c=>u[c.key]=null); if(Object.keys(u).length) db.ref('login_logs').update(u); }); },5000);
// 認證狀態恢復
auth.onAuthStateChanged(u=>{ if(u){ db.ref('users/'+u.uid).once('value').then(s=>{ const d=s.val(); if(d){ currentUser={uid:u.uid,identifier:d.identifier||'',role:d.role||'passenger',loginTime:Date.now()}; if(d.role==='admin'){ isAdmin=true; isSuperAdmin=isSuperAdminEmail(d.identifier); document.getElementById('btn-admin-panel').style.display='block'; loadAdminPanel(); initAdminWalkie(); applyAdminPermissions(); } else { isAdmin=false;isSuperAdmin=false; } document.getElementById('login-modal').classList.remove('active'); showToast('歡迎回來，'+d.identifier); } }); } });

console.log('✅ 完整修復版已啟動');
